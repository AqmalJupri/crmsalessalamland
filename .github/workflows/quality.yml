name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: crm_salam_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_salam_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PRODUCT_SURFACE: crm
      DEPLOYMENT_ENVIRONMENT: ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_salam_test_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_salam_test_ci
      APP_URL: https://crm-ci.example.test
      APP_VERSION: ${{ github.sha }}
      AUTH_HASH_KEY: ci-only-auth-hash-key-at-least-32-characters
      OIDC_ISSUER: https://identity.example.test
      OIDC_CLIENT_ID: crm-ci
      OIDC_CLIENT_SECRET: ci-only-oidc-secret-at-least-16-characters
      OIDC_REDIRECT_URI: https://crm-ci.example.test/api/v1/auth/oidc/callback
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint, typecheck, and coverage gates
        run: pnpm lint && pnpm typecheck && pnpm test:coverage && pnpm test:coverage:production

      - name: Apply production migrations
        run: pnpm db:migrate

      - name: Capture migrated database
        run: |
          mkdir -p "$RUNNER_TEMP/migrated-db"
          docker exec "${{ job.services.postgres.id }}" \
            pg_dump --format=custom --username=postgres --dbname=crm_salam_test_ci \
            > "$RUNNER_TEMP/migrated-db/crm_salam_test_ci.dump"

      - name: Upload migrated database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migrated-db-${{ github.sha }}
          path: ${{ runner.temp }}/migrated-db/crm_salam_test_ci.dump
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

      - name: Verify database invariants
        run: pnpm test:db

      - name: Run demo UI browser and accessibility tests
        run: pnpm test:e2e
        env:
          CRM_DEMO_MODE: "true"
          APP_URL: http://localhost:3000
          OIDC_REDIRECT_URI: http://localhost:3000/api/v1/auth/oidc/callback

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: crm
            app_url: https://crm-ci.example.test
            oidc_client_id: crm-ci
          - surface: tasha
            app_url: https://tasha-ci.example.test
            oidc_client_id: tasha-ci
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PRODUCT_SURFACE: ${{ matrix.surface }}
      DEPLOYMENT_ENVIRONMENT: "ci"
      APP_URL: ${{ matrix.app_url }}
      APP_VERSION: ${{ github.sha }}
      CRM_DEMO_MODE: "false"
      AUTH_HASH_KEY: ci-only-auth-hash-key-at-least-32-characters
      OIDC_ISSUER: https://identity.example.test
      OIDC_CLIENT_ID: ${{ matrix.oidc_client_id }}
      OIDC_CLIENT_SECRET: ci-only-oidc-secret-at-least-16-characters
      OIDC_REDIRECT_URI: ${{ matrix.app_url }}/api/v1/auth/oidc/callback
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Package production artifact
        run: |
          mkdir -p "$RUNNER_TEMP/production-artifact"
          tar -czf \
            "$RUNNER_TEMP/production-artifact/${{ matrix.surface }}-${{ github.sha }}.tar.gz" \
            .next public package.json pnpm-lock.yaml next.config.ts

      - name: Upload production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-${{ matrix.surface }}-${{ github.sha }}
          path: ${{ runner.temp }}/production-artifact/${{ matrix.surface }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  runtime-smoke:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: crm_salam_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_salam_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PRODUCT_SURFACE: crm
      DEPLOYMENT_ENVIRONMENT: ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_salam_test_ci
      APP_URL: https://crm-ci.example.test
      APP_VERSION: ${{ github.sha }}
      AUTH_HASH_KEY: ci-only-auth-hash-key-at-least-32-characters
      OIDC_ISSUER: https://identity.example.test
      OIDC_CLIENT_ID: crm-ci
      OIDC_CLIENT_SECRET: ci-only-oidc-secret-at-least-16-characters
      OIDC_REDIRECT_URI: https://crm-ci.example.test/api/v1/auth/oidc/callback
      CRM_DEMO_MODE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download migrated database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: migrated-db-${{ github.sha }}
          path: ${{ runner.temp }}/migrated-db

      - name: Restore migrated database
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            pg_restore --clean --if-exists --no-owner --no-privileges \
            --username=postgres --dbname=crm_salam_test_ci \
            < "$RUNNER_TEMP/migrated-db/crm_salam_test_ci.dump"

      - name: Download CRM production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-crm-${{ github.sha }}
          path: ${{ runner.temp }}/production-artifact

      - name: Extract CRM production artifact
        run: tar -xzf "$RUNNER_TEMP/production-artifact/crm-${{ github.sha }}.tar.gz"

      - name: Smoke production runtime and security headers
        env:
          PORT: "3100"
        run: |
          setsid pnpm start >"$RUNNER_TEMP/crm-production.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/crm-production.log"
              exit 1
            fi
            sleep 1
          done
          PRODUCTION_SMOKE_URL=http://127.0.0.1:3100 pnpm test:runtime || {
            cat "$RUNNER_TEMP/crm-production.log"
            exit 1
          }
