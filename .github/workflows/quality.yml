name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: crm_salam_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_salam_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_salam_test_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_salam_test_ci
      APP_URL: https://crm-ci.example.test
      APP_VERSION: ${{ github.sha }}
      AUTH_HASH_KEY: ci-only-auth-hash-key-at-least-32-characters
      OIDC_ISSUER: https://identity.example.test
      OIDC_CLIENT_ID: crm-ci
      OIDC_CLIENT_SECRET: ci-only-oidc-secret-at-least-16-characters
      OIDC_REDIRECT_URI: https://crm-ci.example.test/api/v1/auth/oidc/callback
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint, typecheck, and coverage gates
        run: pnpm lint && pnpm typecheck && pnpm test:coverage && pnpm test:coverage:production

      - name: Apply production migrations twice
        run: pnpm db:migrate && pnpm db:migrate

      - name: Build production bundle
        run: pnpm build
        env:
          CRM_DEMO_MODE: "false"

      - name: Smoke production runtime and security headers
        env:
          CRM_DEMO_MODE: "false"
        run: |
          pnpm start >"$RUNNER_TEMP/crm-production.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/crm-production.log"
              exit 1
            fi
            sleep 1
          done
          PRODUCTION_SMOKE_URL=http://127.0.0.1:3000 pnpm test:runtime || {
            cat "$RUNNER_TEMP/crm-production.log"
            exit 1
          }

      - name: Verify database invariants
        run: pnpm test:db

      - name: Run demo UI browser and accessibility tests
        run: pnpm test:e2e
        env:
          CRM_DEMO_MODE: "true"
          APP_URL: http://localhost:3000
